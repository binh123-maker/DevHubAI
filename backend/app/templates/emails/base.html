<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>{% block title %}DevHub AI{% endblock %}</title>
  <style type="text/css">
    /* Reset & Base Client Styles */
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
    body { height: 100% !important; margin: 0 !important; padding: 0 !important; width: 100% !important; background-color: #F8FAFC; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #111827; -webkit-font-smoothing: antialiased; }

    /* Container Layout */
    .email-wrapper { width: 100%; background-color: #F8FAFC; padding: 40px 16px; }
    .email-container { max-width: 560px; margin: 0 auto; background-color: #FFFFFF; border-radius: 16px; border: 1px solid #E5E7EB; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.04), 0 8px 10px -6px rgba(0, 0, 0, 0.02); overflow: hidden; }

    /* Header */
    .email-header { padding: 32px 32px 24px 32px; border-bottom: 1px solid #F1F5F9; text-align: center; }
    .brand-badge { display: inline-block; background-color: #4F46E5; color: #FFFFFF; font-weight: 800; font-size: 16px; width: 36px; height: 36px; line-height: 36px; border-radius: 10px; text-align: center; margin-right: 8px; vertical-align: middle; }
    .brand-name { font-size: 24px; font-weight: 800; color: #111827; letter-spacing: -0.5px; text-decoration: none; vertical-align: middle; }

    /* Content Area */
    .email-body { padding: 32px; text-align: left; }
    .email-heading { font-size: 24px; font-weight: 700; color: #111827; margin: 0 0 16px 0; line-height: 1.3; }
    .email-text { font-size: 16px; line-height: 1.6; color: #374151; margin: 0 0 20px 0; }
    .user-greeting { font-size: 16px; font-weight: 600; color: #111827; margin-bottom: 12px; }

    /* Badges & Cards */
    .expiration-badge { display: inline-block; background-color: #EEF2FF; border: 1px solid #C7D2FE; color: #3730A3; font-size: 13px; font-weight: 600; padding: 6px 14px; border-radius: 20px; margin-bottom: 24px; }
    .otp-container { background-color: #F8FAFC; border: 1.5px dashed #A5B4FC; border-radius: 16px; padding: 24px; text-align: center; margin: 24px 0; }
    .otp-code { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace; font-size: 40px; font-weight: 800; letter-spacing: 10px; color: #4F46E5; text-align: center; display: inline-block; }

    /* Security Box */
    .security-box { background-color: #FFFBEB; border: 1px solid #FDE68A; border-radius: 12px; padding: 20px; margin-top: 28px; }
    .security-title { font-size: 14px; font-weight: 700; color: #92400E; margin-bottom: 8px; display: flex; align-items: center; }
    .security-list { margin: 0; padding-left: 20px; font-size: 13px; color: #78350F; line-height: 1.6; }
    .security-list li { margin-bottom: 4px; }

    /* Success Alert Box */
    .success-box { background-color: #ECFDF5; border: 1px solid #A7F3D0; border-radius: 12px; padding: 20px; margin: 24px 0; color: #065F46; font-size: 14px; line-height: 1.6; }
    .success-title { font-weight: 700; font-size: 15px; margin-bottom: 6px; }

    /* Footer */
    .email-footer { padding: 28px 32px; background-color: #F8FAFC; border-top: 1px solid #F1F5F9; text-align: center; font-size: 13px; color: #6B7280; line-height: 1.5; }
    .footer-brand { font-weight: 700; color: #374151; font-size: 14px; margin-bottom: 4px; }
    .footer-tagline { font-size: 12px; color: #9CA3AF; margin-bottom: 12px; }
    .footer-links a { color: #4F46E5; text-decoration: none; font-weight: 500; }
    .footer-links a:hover { text-decoration: underline; }
    .footer-copy { font-size: 12px; color: #9CA3AF; margin-top: 12px; }

    /* Media Queries for Mobile Responsiveness */
    @media only screen and (max-width: 600px) {
      .email-wrapper { padding: 12px 8px !important; }
      .email-header { padding: 24px 20px 20px 20px !important; }
      .email-body { padding: 24px 20px !important; }
      .email-footer { padding: 24px 20px !important; }
      .otp-code { font-size: 32px !important; letter-spacing: 6px !important; }
    }
  </style>
</head>
<body>
  <div class="email-wrapper">
    <div class="email-container">
      <!-- Header -->
      <div class="email-header">
        <span class="brand-badge">DH</span>
        <span class="brand-name">DevHub AI</span>
      </div>

      <!-- Main Body -->
      <div class="email-body">
        {% block content %}{% endblock %}
      </div>

      <!-- Footer -->
      <div class="email-footer">
        <div class="footer-brand">DevHub AI</div>
        <div class="footer-tagline">Built for Developers</div>
        <div class="footer-copy">© 2026 DevHub AI. All rights reserved.</div>
      </div>
    </div>
  </div>
</body>
</html>
